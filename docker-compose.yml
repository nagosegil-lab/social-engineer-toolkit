version: '3.8'

services:
  trading-bot:
    build: .
    ports:
      - "8080:8080"
    environment:
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8080
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./trading_bot/ai/saved_models:/app/trading_bot/ai/saved_models
    restart: unless-stopped
    

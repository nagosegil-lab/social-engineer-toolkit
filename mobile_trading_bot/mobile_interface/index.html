<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>בוט מסחר נייד - MT5 + AI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>📱 בוט מסחר נייד</h1>
            <div class="status-indicator" id="connectionStatus">
                <span class="status-dot"></span>
                <span id="statusText">מתחבר...</span>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="tab-navigation">
            <button class="tab-btn active" data-tab="dashboard">דשבורד</button>
            <button class="tab-btn" data-tab="trading">מסחר</button>
            <button class="tab-btn" data-tab="ai">AI ניתוח</button>
            <button class="tab-btn" data-tab="positions">פוזיציות</button>
            <button class="tab-btn" data-tab="settings">הגדרות</button>
        </nav>

        <!-- Dashboard Tab -->
        <div class="tab-content active" id="dashboard">
            <div class="card">
                <h2>מידע על חשבון</h2>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">יתרה:</span>
                        <span class="info-value" id="balance">₪0.00</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">שווי נכסים:</span>
                        <span class="info-value" id="equity">₪0.00</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">רווח/הפסד:</span>
                        <span class="info-value" id="profit">₪0.00</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">פוזיציות פתוחות:</span>
                        <span class="info-value" id="openPositions">0</span>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="refreshAccountInfo()">רענן</button>
            </div>

            <div class="card">
                <h2>מסחר מהיר</h2>
                <div class="quick-trade">
                    <select id="quickSymbol" class="input-field">
                        <option value="EURUSD">EUR/USD</option>
                        <option value="GBPUSD">GBP/USD</option>
                        <option value="USDJPY">USD/JPY</option>
                        <option value="BTCUSD">BTC/USD</option>
                    </select>
                    <div class="price-display">
                        <span id="currentBid">-</span> / <span id="currentAsk">-</span>
                    </div>
                    <div class="trade-buttons">
                        <button class="btn btn-buy" onclick="quickTrade('BUY')">קנה</button>
                        <button class="btn btn-sell" onclick="quickTrade('SELL')">מכר</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trading Tab -->
        <div class="tab-content" id="trading">
            <div class="card">
                <h2>ביצוע עסקה</h2>
                <form id="tradeForm" onsubmit="placeOrder(event)">
                    <div class="form-group">
                        <label>סמל מסחר:</label>
                        <input type="text" id="symbol" class="input-field" placeholder="EURUSD" required>
                        <button type="button" class="btn btn-small" onclick="getSymbolPrice()">קבל מחיר</button>
                    </div>
                    
                    <div class="form-group">
                        <label>סוג עסקה:</label>
                        <select id="orderType" class="input-field" required>
                            <option value="BUY">קנייה</option>
                            <option value="SELL">מכירה</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>כמות (Lots):</label>
                        <input type="number" id="volume" class="input-field" step="0.01" min="0.01" value="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label>מחיר (אופציונלי):</label>
                        <input type="number" id="price" class="input-field" step="0.00001">
                    </div>
                    
                    <div class="form-group">
                        <label>Stop Loss (pips):</label>
                        <input type="number" id="stopLoss" class="input-field" step="1">
                    </div>
                    
                    <div class="form-group">
                        <label>Take Profit (pips):</label>
                        <input type="number" id="takeProfit" class="input-field" step="1">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">ביצוע עסקה</button>
                </form>
            </div>
        </div>

        <!-- AI Analysis Tab -->
        <div class="tab-content" id="ai">
            <div class="card">
                <h2>ניתוח AI</h2>
                <div class="form-group">
                    <label>סמל לניתוח:</label>
                    <input type="text" id="aiSymbol" class="input-field" placeholder="EURUSD" value="EURUSD">
                    <button class="btn btn-primary" onclick="getAIAnalysis()">קבל ניתוח</button>
                </div>
                
                <div id="aiResults" class="ai-results"></div>
            </div>
            
            <div class="card">
                <h2>אימון מודל AI</h2>
                <p>אימון מודל AI על נתונים היסטוריים</p>
                <div class="form-group">
                    <label>סמל:</label>
                    <input type="text" id="trainSymbol" class="input-field" placeholder="EURUSD">
                    <label>מספר תקופות:</label>
                    <input type="number" id="trainPeriods" class="input-field" value="1000">
                    <button class="btn btn-secondary" onclick="trainAIModel()">אימון מודל</button>
                </div>
                <div id="trainingResults"></div>
            </div>
        </div>

        <!-- Positions Tab -->
        <div class="tab-content" id="positions">
            <div class="card">
                <h2>פוזיציות פתוחות</h2>
                <button class="btn btn-secondary" onclick="refreshPositions()">רענן</button>
                <div id="positionsList" class="positions-list"></div>
            </div>
        </div>

        <!-- Settings Tab -->
        <div class="tab-content" id="settings">
            <div class="card">
                <h2>הגדרות MT5</h2>
                <form id="connectionForm" onsubmit="connectMT5(event)">
                    <div class="form-group">
                        <label>Login:</label>
                        <input type="number" id="mt5Login" class="input-field" placeholder="מספר חשבון">
                    </div>
                    
                    <div class="form-group">
                        <label>Password:</label>
                        <input type="password" id="mt5Password" class="input-field" placeholder="סיסמה">
                    </div>
                    
                    <div class="form-group">
                        <label>Server:</label>
                        <input type="text" id="mt5Server" class="input-field" placeholder="שם שרת">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">התחבר ל-MT5</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText">טוען...</p>
    </div>

    <!-- Toast Notifications -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
